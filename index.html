<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MIDI Controller Studio — Online 3D Piano &amp; Web Synthesizer</title>
    <meta
      name="description"
      content="Play realistic multi-harmonic 3D piano and analog-style web synthesizer right in your browser. Supports computer keyboard, touch chords, USB MIDI controllers, ADSR controls, low-pass filter, and live reverb."
    />
    <meta
      name="keywords"
      content="MIDI controller, online piano, 3D piano keyboard, web synthesizer, Web Audio API synth, virtual piano, browser MIDI studio"
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#faf7f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12100f" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph / Social SEO -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MIDI Controller Studio — Online 3D Piano & Web Synthesizer" />
    <meta
      property="og:description"
      content="Interactive 3D piano keyboard and web synthesizer with realistic harmonic synthesis, real-time reverb, filter controls, and responsive touch & keyboard support."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MIDI Controller Studio — Online 3D Piano & Web Synthesizer" />
    <meta
      name="twitter:description"
      content="Play a responsive 3D piano and real-time web synthesizer in Light or Dark mode."
    />

    <!-- Clean Inline Brand SVG Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%23dc2626'/%3E%3Cstop offset='100%25' stop-color='%23f97316'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Crect x='10' y='16' width='44' height='32' rx='4' fill='%23ffffff'/%3E%3Crect x='19' y='16' width='6' height='19' rx='1.5' fill='%23181412'/%3E%3Crect x='29' y='16' width='6' height='19' rx='1.5' fill='%23181412'/%3E%3Crect x='39' y='16' width='6' height='19' rx='1.5' fill='%23181412'/%3E%3C/svg%3E"
    />

    <!-- Prevent theme flash before React mounts -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("midi-studio-theme");
          var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = saved === "light" || saved === "dark" ? saved : (prefersDark ? "dark" : "light");
          if (theme === "dark") document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/app/main.tsx"></script>
  </body>
</html>
